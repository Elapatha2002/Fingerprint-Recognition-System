<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #e6edf7; background: transparent; font-size: 14px; }
    .panel { border: 1px solid #334155; border-radius: 10px; padding: 14px; background: #101821; }
    .status { display: flex; gap: 8px; align-items: center; min-height: 22px; color: #a8b3c7; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; flex: none; }
    .ready .dot { background: #22c55e; box-shadow: 0 0 0 3px #22c55e22; }
    .error .dot { background: #ef4444; }
    .pair { display: flex; gap: 8px; margin-top: 12px; }
    input { min-width: 0; flex: 1; border: 1px solid #475569; border-radius: 7px; padding: 10px 11px;
      background: #17212b; color: #f8fafc; outline: none; }
    input:focus { border-color: #60a5fa; box-shadow: 0 0 0 2px #60a5fa33; }
    button { border: 1px solid #475569; border-radius: 7px; min-height: 40px; padding: 0 16px;
      background: #1e293b; color: #f8fafc; font-weight: 600; cursor: pointer; }
    button.primary { width: 100%; margin-top: 12px; background: #3b82f6; border-color: #3b82f6; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hint { margin-top: 9px; color: #94a3b8; font-size: 12px; line-height: 1.45; }
    .result { display: none; margin-top: 12px; gap: 12px; align-items: center; }
    .result.show { display: flex; }
    .result img { width: 96px; max-height: 128px; object-fit: contain; border-radius: 6px; background: white; }
    .result-text { color: #cbd5e1; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="panel">
    <div id="status" class="status"><span class="dot"></span><span id="statusText">Checking local bridge…</span></div>
    <div id="pair" class="pair">
      <input id="token" type="password" autocomplete="off" aria-label="Bridge pairing code"
             placeholder="Pairing code from bridge window">
      <button id="connect" type="button">Connect</button>
    </div>
    <button id="capture" class="primary" type="button" disabled>Capture fingerprint</button>
    <div id="hint" class="hint">Start the local Mantra bridge, enter its pairing code, then connect.</div>
    <div id="result" class="result">
      <img id="preview" alt="Captured fingerprint preview">
      <div id="resultText" class="result-text"></div>
    </div>
  </div>
  <script>
    const TOKEN_KEY = "fingerprint_recognition_bridge_token";
    let bridgeUrl = "http://127.0.0.1:8766";
    let connected = false;
    let firstRender = true;
    let matching = null;
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const tokenInput = document.getElementById("token");
    const captureButton = document.getElementById("capture");
    const hint = document.getElementById("hint");
    const result = document.getElementById("result");

    function post(type, extra = {}) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, "*");
    }
    function resize() { post("streamlit:setFrameHeight", {height: document.documentElement.scrollHeight}); }
    function setValue(value) { post("streamlit:setComponentValue", {value, dataType: "json"}); }
    function setStatus(kind, message) {
      status.className = `status ${kind || ""}`;
      statusText.textContent = message;
      resize();
    }
    function token() { return tokenInput.value.trim(); }
    async function request(path, options = {}) {
      const response = await fetch(`${bridgeUrl}${path}`, {
        signal: AbortSignal.timeout(145000),
        cache: "no-store",
        mode: "cors",
        targetAddressSpace: "loopback",
        ...options,
        headers: {"X-FRS-Bridge-Token": token(), ...(options.headers || {})}
      });
      let payload;
      try { payload = await response.json(); }
      catch (_) { throw new Error(`Local bridge returned HTTP ${response.status}.`); }
      if (!response.ok || !payload.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      return payload;
    }
    async function connect() {
      if (!token()) { setStatus("error", "Enter the pairing code shown by the local bridge."); return; }
      connected = false;
      captureButton.disabled = true;
      setStatus("", "Connecting to the local sensor…");
      try {
        const payload = await request("/status");
        if (payload.protocol_version !== 2 || payload.matcher !== "Mantra MFS100 MatchISO") {
          throw new Error("This bridge is outdated. Restart the updated FRS bridge on your PC.");
        }
        localStorage.setItem(TOKEN_KEY, token());
        connected = true;
        captureButton.disabled = false;
        const device = [payload.make, payload.model].filter(Boolean).join(" ") || "Mantra MFS100";
        setStatus("ready", `${device} ready`);
        hint.textContent = "Place a finger only after pressing Capture fingerprint.";
      } catch (error) {
        setStatus("error", error.message || "Could not connect to the local bridge.");
        hint.textContent = "Keep the bridge window open, confirm the pairing code, and allow local network access in the browser.";
      }
    }
    async function capture() {
      if (!connected) return connect();
      captureButton.disabled = true;
      document.getElementById("connect").disabled = true;
      const task = matching;
      // Clear an earlier result immediately, including when the next capture fails.
      setValue({ok: false, event_id: crypto.randomUUID(), pending: true});
      result.classList.remove("show");
      setStatus("", "Scanner started — place one finger flat on the sensor…");
      hint.textContent = "The SDK stops automatically after capture or timeout.";
      try {
        const payload = await request("/capture", {
          method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"
        });
        if (!payload.iso_template || payload.protocol_version !== 2) {
          throw new Error("No ISO template returned. Restart the updated FRS bridge.");
        }
        if (task) {
          setStatus("", "Comparing ISO templates with the Mantra SDK…");
          payload.match_result = await request("/match", {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({probe: payload.iso_template,
              candidates: task.candidates, request_id: task.request_id})
          });
          if (!matching || matching.request_id !== task.request_id) {
            throw new Error("The enrolment directory changed. Capture again.");
          }
        }
        document.getElementById("preview").src = `data:image/png;base64,${payload.image_base64}`;
        document.getElementById("resultText").textContent =
          `${payload.width}×${payload.height} px · quality ${payload.quality ?? "not reported"} · NFIQ ${payload.nfiq ?? "not reported"}`;
        result.classList.add("show");
        setStatus("ready", "Fingerprint captured successfully");
        hint.textContent = task ? "Native SDK comparison completed." : "The ISO template is ready for enrolment.";
        setValue(payload);
      } catch (error) {
        setValue({ok: false, event_id: crypto.randomUUID(), error: "Capture or matching failed. See the sensor panel and try again."});
        setStatus("error", error.message || "Fingerprint capture failed.");
        hint.textContent = "Try again with a clean, dry finger held still on the scanner.";
      } finally {
        captureButton.disabled = !connected;
        document.getElementById("connect").disabled = false;
        resize();
      }
    }

    document.getElementById("connect").addEventListener("click", connect);
    captureButton.addEventListener("click", capture);
    tokenInput.addEventListener("keydown", event => { if (event.key === "Enter") connect(); });
    window.addEventListener("message", event => {
      if (event.source !== window.parent || !event.data || event.data.type !== "streamlit:render") return;
      bridgeUrl = (event.data.args.bridge_url || bridgeUrl).replace(/\/$/, "");
      matching = event.data.args.matching || null;
      if (firstRender) {
        firstRender = false;
        tokenInput.value = localStorage.getItem(TOKEN_KEY) || "";
        if (token()) connect(); else setStatus("", "Local bridge pairing required");
      }
      resize();
    });
    post("streamlit:componentReady", {apiVersion: 1});
    resize();
  </script>
</body>
</html>
