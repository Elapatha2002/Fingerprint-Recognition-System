services:
  - type: web
    name: fingerprint-recognition-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run demo_matcher/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        sync: false
      - key: FRS_ACCESS_PASSWORD_HASH
        sync: false
      - key: MATCH_THRESHOLD
        value: "0.55"
      - key: MANTRA_SENSOR_TRANSPORT
        value: bridge
      - key: MANTRA_BRIDGE_URL
        value: http://127.0.0.1:8766
